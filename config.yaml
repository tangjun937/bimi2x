# ===== Telegram 频道 -> 英文翻译 -> Buffer -> X 自动搬运 =====

# 当前数据源：hot = 直接抓公开热点（Hacker News 首页 / Google News RSS / arXiv），
# 不再依赖 Telegram 频道。想切回 TG 把 fetch.backend 改回 web 即可。
channel: "hot"

# 热点模式只有一个「虚拟频道」
channels:
  - name: "hot"
    lang: "en"
    rewrite: false

fetch:
  # hot      : 抓公开热点（HN / Google News RSS / arXiv），免费无凭证
  # web      : 抓 https://t.me/s/<channel> 网页版
  # telethon : MTProto 用户会话，需 api_id/api_hash + 手机号登录
  # bot      : 仅频道管理员可用
  backend: "hot"
  interval_seconds: 30
  # 每次运行只发 1 篇（抓一条、当场发；重复就跳过换下一条）
  max_per_cycle: 1
  # 最多尝试多少条候选：前几条撞重复也还能换一条发出去
  max_tries: 8
  # 每日发文配额（用户 2026-11-26：一天 5 篇 = 1 长 + 4 短）。
  # "一天"按发布日算：北京 18:00 → 次日 08:20 跨午夜仍算同一天。0 = 不限制
  daily_max: 5
  request_timeout: 20

publish:
  # 首次启动时，频道里已有的历史帖是否也发出去
  # false = 只发接入之后的新帖（推荐）
  publish_existing_on_boot: false
  dry_run: false
  # buffer | command | http | dry_run
  target: "buffer"
  # jianglin124 开了蓝 V（X Premium），单条上限 25000 字，不再截断
  max_len: 25000
  # 发文是否带上 Telegram 原文链接（false = 只发正文，不带链接）
  include_source_link: false
  # 每天一篇长文：到 long_at_hour（北京）这一档还没写过长文，就按长文写；
  # 其余档一律写短文。当日长文已用 / 配额用满，就不再写长文。
  long_per_day: true
  long_at_hour: 20
  # 配图：从文章页取 og:image → 提交到仓库 media/ → raw 链接交给 Buffer
  attach_image: true
  # 有配图的优先：按影响力顺序往下探前 N 条候选，谁有图就把谁提到第一位再发。
  # 一条都没图（或超时）就按原顺序发——配图是加分项，不牺牲选题质量。
  prefer_image: true
  image_probe: 4
  image_probe_seconds: 20
  # 图表池优先：发帖时先看 data/chart_queue.json 里有没有跟话题对得上的图表
  # （对标账号 @RyanDetrick / @charliebilello / @LizAnnSonders 的图），有就用它，
  # 没有或不够格再退回文章自己的 og:image。min_score：同代码 +3、同主题词 +1。
  # 图表池：2026-11-23 用户明确要求"只许用文章自带图、第三方图表一律不用"，所以关掉。
  # 队列和代码都留着（data/chart_queue.json、tg2x/charts.py），想恢复改回 true 即可。
  chart_first: false
  chart_credit: true
  # 一致性硬条件：图表必须和稿件同一个主体（同 $代码 或同公司名），
  # 且是 10 天内发的，且分数够（同代码 +3 / 同公司 +2 / 同主题词 +1）。
  # 不满足就用文章自己的图——宁可没图，也不挂一张对不上的图。
  chart_min_score: 4
  chart_max_age_days: 10

  buffer:
    token_env: "BUFFER_TOKEN"
    # 留空 = 自动在 Buffer 里找连着的 X 频道并缓存到 data/buffer_channel.json
    # 有多个 X 频道时，这里必须填（先跑 python run.py buffer-setup 看 id）
    organization_id: ""
    channel_id: "6af332c362b70b94b0e38770"
    # shareNow（立即发）| addToQueue（进 Buffer 队列的下一个空档）| customScheduled
    mode: "shareNow"
    # 同批次的第 2 条起，自动排到 60 分钟后再发（间隔至少 60 分钟）
    spacing_min_minutes: 100
    spacing_max_minutes: 100
    # telegram_url : 直接把 Telegram CDN 图片链接传给 Buffer（零成本，默认）
    # none         : 只发文字
    media: "telegram_url"
    max_assets: 4
    timeout: 30

  # target=command 时才用：调用任意脚本，JSON 从 stdin 传入，退出码 0 为成功
  command:
    command: 'python "D:/2026-11-12-16-57-36/tg2x/examples/x_poster_example.py"'

  # target=http 时才用
  http:
    url: ""
    token_env: "X_POSTER_TOKEN"

translate:
  # google_free : 免费、无需 key（默认）
  # llm         : 走 OpenAI 兼容接口，译文更自然
  provider: "google_free"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  timeout: 30
  # 两次翻译请求的最小间隔（秒）。免费接口会限流，别设为 0
  min_interval: 1.5
  # 主引擎被限流时的备用引擎：留空 = 不启用；"mymemory" = 用 MyMemory 免费接口应急
  fallback: ""
  prefix: ""
  # 话题标签是否抽出到末尾。false = 留在原位由翻译引擎处理（推荐）
  keep_hashtags: false
  strip_urls_from_translate: true

# DeepSeek 写作引擎：洗稿 + 互动形式 + 写作要求总册核心原则
writer:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.7
  timeout: 60
  # 风格硬要求（运营文档 + 用户 2026-11-22/23 指令）：
  # 每篇必须点到具体公司/股票代码；没配图就不许写长。
  # 结尾不强制问句——跟着句意走（要读者表态时才问），所以 require_hook 关掉。
  require_stock_ref: true
  require_hook: false
  # 0 = 不限制（用户 2026-11-26：上限 2.5 万字符）
  max_words_no_image: 0

# 发文优先级排序
rank:
  # 热点模式关掉 DeepSeek 排序：抓取器已按「总统 > 财团主理人 > 其他政客 + 热度」排好
  enabled: false
  # true = 主题优先(github项目 > 传统金融含股市 > 虚拟货币)；false = 媒体优先(视频>图文>无图冲突>普通)
  topic_first: true

# 原文清洗：频道尾巴的推广/投稿联系方式不要带到 X
cleanup:
  # 内容合规过滤（中国政治敏感 + 关于中国只发 AI 类）。bimi2x 开启：不发关于中国时政新闻
  content_filter: true
  # 只搬带图/视频的内容，纯文字长文跳过。bimi2x 关闭（AI 新闻以文字为主）
  media_only: false
  # 新鲜度过滤：只发最近 N 小时内的帖子，超过的旧帖直接跳过（防止频道更新慢时补发旧闻）
  max_age_hours: 36
  # 记录保留天数：写过的内容只保留 N 天，过期自动删除（热点模式防重复写同一话题）
  retention_days: 5
  # 去掉每帖第一行的【标题/抬头】，只发正文（仅 BIMI_CHS 格式需要）
  remove_heading: false
  # 去掉快讯开头用 <b>/<strong> 加粗的标题行（ONEMILLION_AI 每条快讯是「加粗标题 + 正文」）
  strip_heading: true
  remove_patterns:
    - '关注[^\n]*?频道[^\n]*'
    - '投稿\s*[:：]\s*@\w+'
    - '商务合作\s*[:：][^\n]*'
    - '^\s*[➡️👉]\s*[^\n]*$'
    - '^\s*@\w+\s*$'
    # ONEMILLION_AI 每条尾巴：「信源/来源」行 + 固定频道引流「动察 Beating 频道 · 动察 Beating 社群」
    - '^\s*(?:信源|来源)\s*[:：]\s*[^\n]*$'
    - '^\s*(?:信源|来源)\s*$'
    - '动察\s*Beating[^\n]*'
  # 命中任一词就跳过不发（X 对赌博/灰产/涉黄内容有限制，建议按需打开）
  block_keywords: []

  # 广告/引流贴识别：命中任意「强广告词」整条跳过；「弱广告词」累计 2 个也跳过
  # 另外自动识别：t.me 邀请链接、纯链接堆、⚡️⚡️⚡️ 刷屏层
  # 注意：这是 AI 科技频道，正文常出现「注册/点击/代理/入口」等词（Agent=代理），
  # 所以弱词只保留明确的推广话术，避免误杀正常新闻
  ad_keywords:
    - "返水"
    - "返佣"
    - "首存"
    - "上押"
    - "下注"
    - "投注"
    - "包网"
    - "刷流水"
    - "招代理"
    - "代理招商"
    - "邀请码"
    - "注册送"
    - "充值送"
    - "入金送"
    - "带单老师"
    - "合约带单"
    - "买粉"
    - "刷粉"
    - "精选频道"
    - "频道推荐"
    - "收录频道"
    - "推荐频道"
    - "频道导航"
    - "频道目录"
    - "互推"
    - "广告位"
    - "推广位"
  ad_weak_keywords:
    - "加群"
    - "进群"
    - "私聊"
    - "邀请"
    - "领取"
    - "福利"
    - "返利"
    - "官方频道"
  # 弱广告词累计命中多少个才判定为广告
  ad_weak_threshold: 2

  # 关键词去重（纯规则、不用 AI）：与最近已发内容关键词重叠度过高则跳过，避免重复发
  dedup_enabled: true
  dedup_window: 10       # 对比最近多少条已发内容
  dedup_threshold: 0.6   # Jaccard 相似度阈值（0-1，越大越严格，0.6=需60%关键词重叠）

storage:
  data_dir: "data"
  # 原文 + 图片归档到本地，保证"复制下来"这一步不丢东西
  archive_media: false
  # 每频道只保留最近多少条去重记录，更早的自动删除（防止库无限增长）。0 = 不清理
  prune_keep: 10

# 跑完通过你的 bot 给自己发一条回执（不是用来读频道的，bot 进不了别人的频道）
notify:
  enabled: true
  bot_token_env: "TG_BOT_TOKEN"
  chat_id_env: "TG_CHAT_ID"
  on_success: true
  on_failure: true
  # 回执里是否带上发出去的英文正文（方便快速过一眼）
  include_text: true
  # 没有新帖就不发消息，避免定时任务每 10 分钟骚扰一次
  quiet_when_noop: true
  timeout: 20
